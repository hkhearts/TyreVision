<!-- Fleet Manager Page -->
<main>
<link rel="stylesheet" href="/css/main.css"/>
<style>
.fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-md); }
.vehicle-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s var(--ease-bounce), border-color 0.15s, box-shadow 0.15s;
}
.vehicle-card:hover { transform: translateY(-3px); border-color: var(--border-bright); box-shadow: var(--shadow-md); }
.vehicle-card-header { padding: var(--space-lg); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-md); }
.vehicle-card-body { padding: var(--space-md) var(--space-lg); }
.tire-map-mini { display: flex; flex-direction: column; gap: 6px; align-items: center; margin: 8px 0; }
.tire-row-mini { display: flex; gap: 24px; align-items: center; }
.vehicle-divider { width: 20px; height: 40px; background: var(--bg-surface); border-radius: 4px; border: 1px solid var(--border); }
.tire-chip {
  width: 22px; height: 36px;
  border-radius: 4px;
  cursor: pointer;
  transition: transform 0.15s;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.55rem; font-weight: 700;
}
.tire-chip:hover { transform: scale(1.2); }
.tire-chip.safe     { background: var(--safe);     box-shadow: 0 0 6px rgba(0,230,118,.5); }
.tire-chip.monitor  { background: var(--monitor);  box-shadow: 0 0 6px rgba(255,204,0,.5); }
.tire-chip.critical { background: var(--critical); box-shadow: 0 0 6px rgba(255,107,0,.5); animation: pulse-glow 2s ease infinite; }
.tire-chip.dno      { background: var(--dno);      box-shadow: 0 0 8px rgba(255,23,68,.8); animation: pulse-glow 1s ease infinite; }
.tire-chip.unknown  { background: var(--bg-surface); border: 1px solid var(--border); }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: var(--space-lg); }
.filter-chip {
  padding: 5px 14px; border-radius: var(--radius-full);
  font-size: 0.78rem; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-surface);
  color: var(--text-secondary); transition: all 0.15s;
}
.filter-chip:hover { border-color: var(--cyan); color: var(--cyan); }
.filter-chip.active { background: var(--cyan-glow); border-color: var(--cyan); color: var(--cyan); }
</style>

<div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-xl)">
    <div>
      <h1 style="margin-bottom:4px">🚛 Fleet Manager</h1>
      <p id="fleet-subtitle">Loading fleet...</p>
    </div>
    <button class="btn btn-primary" onclick="navigate('inspect')">+ New Inspection</button>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <button class="filter-chip active" onclick="setFilter('all', this)">All Vehicles</button>
    <button class="filter-chip" onclick="setFilter('dno', this)">🚫 DNO</button>
    <button class="filter-chip" onclick="setFilter('critical', this)">⚠️ Critical</button>
    <button class="filter-chip" onclick="setFilter('monitor', this)">👁️ Monitor</button>
    <button class="filter-chip" onclick="setFilter('safe', this)">✅ Safe</button>
    <input class="form-input" placeholder="Search vehicle..." id="search-input"
      oninput="filterVehicles()" style="height:36px;padding:6px 12px;font-size:0.85rem;flex:1;max-width:250px"/>
  </div>

  <!-- Vehicle Grid -->
  <div class="fleet-grid" id="vehicle-grid">
    <div class="skeleton" style="height:240px;border-radius:var(--radius-lg)"></div>
    <div class="skeleton" style="height:240px;border-radius:var(--radius-lg)"></div>
    <div class="skeleton" style="height:240px;border-radius:var(--radius-lg)"></div>
  </div>
</div>

<script>
let _allVehicles = [];
let _activeFilter = 'all';

(async function init() {
  let data = null;
  try {
    const r = await fetch('http://localhost:5000/api/fleet', {signal:AbortSignal.timeout(3000)});
    if (r.ok) data = await r.json();
  } catch {}
  if (!data) { try { data = await (await fetch('/data/fleet-seed.json')).json(); } catch {} }
  _allVehicles = data?.vehicles || [];
  document.getElementById('fleet-subtitle').textContent =
    `${_allVehicles.length} vehicles • ${_allVehicles.reduce((s,v)=>s+(v.tires||[]).length,0)} tires monitored`;
  renderVehicles();
})();

function posKey(p){ const l=(p||'').toLowerCase(); return l.includes('steer')||l.includes('front')?'steer':l.includes('trailer')?'trailer':'drive'; }
function dotAge(d){ const m=(d||'').match(/(\d{2})(\d{2})/); if(!m)return 36; const ww=parseInt(m[1]),yy=parseInt(m[2]); const yr=yy<=30?2000+yy:1900+yy; const mfg=new Date(yr,0,1); mfg.setDate(mfg.getDate()+(ww-1)*7); return(Date.now()-mfg.getTime())/(1e3*60*60*24*30.44); }
function tireRisk(t){ const BL={steer:150000,drive:250000,trailer:180000}; const pk=posKey(t.position); const pct=(t.mileageOnTire||0)/BL[pk]; const age=dotAge(t.dotCode); if(pct>=.95||age>108)return'DO-NOT-OPERATE'; if(pct>=.82||age>96)return'CRITICAL'; if(pct>=.65||age>72)return'MONITOR'; return'SAFE'; }
function vehicleWorstRisk(v){ return(v.tires||[]).reduce((w,t)=>{const r=tireRisk(t);const o={'SAFE':0,'MONITOR':1,'CRITICAL':2,'DO-NOT-OPERATE':3};return o[r]>o[w]?r:w;},'SAFE'); }
function drivingScore(t){ if(!t)return 100; return Math.round(Math.max(0,100-Math.min(1,(t.harshBrakeEvents||0)/30)*25-Math.min(1,(t.harshAccelEvents||0)/25)*20-Math.min(1,(t.corneringEvents||0)/20)*15-Math.min(1,(t.idleTimePct||0)/30)*10-Math.max(0,(10-(t.fuelEfficiency||10))/10)*10-Math.min(1,Math.max(0,((t.engineTempC||90)-95)/15))*20)); }

function riskToCss(r){ return{SAFE:'safe',MONITOR:'monitor',CRITICAL:'critical','DO-NOT-OPERATE':'dno'}[r]||'unknown'; }
function riskLabel(r){ return r==='DO-NOT-OPERATE'?'DNO':r; }

function renderVehicles() {
  const search = (document.getElementById('search-input')?.value || '').toLowerCase();
  const filtered = _allVehicles.filter(v => {
    const wr = vehicleWorstRisk(v);
    const matchFilter = _activeFilter === 'all' ||
      (_activeFilter === 'dno'      && wr === 'DO-NOT-OPERATE') ||
      (_activeFilter === 'critical' && wr === 'CRITICAL') ||
      (_activeFilter === 'monitor'  && wr === 'MONITOR') ||
      (_activeFilter === 'safe'     && wr === 'SAFE');
    const matchSearch = !search || `${v.make} ${v.model} ${v.regNo}`.toLowerCase().includes(search);
    return matchFilter && matchSearch;
  });

  if (!filtered.length) {
    document.getElementById('vehicle-grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted)"><div style="font-size:3rem;margin-bottom:1rem">🔍</div><p>No vehicles match filter</p></div>`;
    return;
  }

  document.getElementById('vehicle-grid').innerHTML = filtered.map(v => {
    const wr = vehicleWorstRisk(v);
    const cls = riskToCss(wr);
    const ds  = drivingScore(v.telematics);
    const dsColor = ds>=80?'#00e676':ds>=60?'#ffcc00':'#ff6b00';
    const tires = v.tires || [];

    // Arrange tires in vehicle top-down layout
    const steerTires   = tires.filter(t=>posKey(t.position)==='steer');
    const driveTires   = tires.filter(t=>posKey(t.position)==='drive');
    const trailerTires = tires.filter(t=>posKey(t.position)==='trailer');
    const L = (arr) => arr.filter((_,i)=>i%2===0);
    const R = (arr) => arr.filter((_,i)=>i%2!==0);
    const allL = [...L(steerTires), ...L(driveTires), ...L(trailerTires)];
    const allR = [...R(steerTires), ...R(driveTires), ...R(trailerTires)];
    const half = Math.ceil(tires.length/2);
    const leftTires  = tires.slice(0, half);
    const rightTires = tires.slice(half);

    const renderTireChip = (t) => {
      if (!t) return `<div class="tire-chip unknown"></div>`;
      const r = tireRisk(t), c = riskToCss(r);
      return `<div class="tire-chip ${c}" title="${t.label}: ${r}">${riskLabel(r).slice(0,1)}</div>`;
    };

    const tireRows = [];
    const maxRows = Math.max(leftTires.length, rightTires.length);
    for (let i=0;i<maxRows;i++) {
      tireRows.push(`
        <div class="tire-row-mini">
          ${renderTireChip(leftTires[i])}
          <div class="vehicle-divider"></div>
          ${renderTireChip(rightTires[i])}
        </div>
      `);
    }

    return `
      <div class="vehicle-card animate-fade-in" onclick="navigate('vehicle')">
        <div class="vehicle-card-header">
          <div style="font-size:2rem">${v.type==='truck'?'🚛':v.type==='van'?'🚐':'🚗'}</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:1rem">${v.make} ${v.model}</div>
            <div style="font-size:0.78rem;color:var(--text-muted)">${v.regNo} • ${v.year}</div>
            <div style="font-size:0.72rem;color:var(--text-muted)">${(v.mileageKm||0).toLocaleString()} km total</div>
          </div>
          <div style="text-align:right">
            <span class="risk-badge ${cls}">${riskLabel(wr)}</span>
            <div style="font-size:0.7rem;margin-top:4px;color:${dsColor}">Drive: ${ds}/100</div>
          </div>
        </div>
        <div class="vehicle-card-body">
          <div style="display:flex;gap:var(--space-md);align-items:flex-start">
            <!-- Tire Layout -->
            <div>
              <div class="label" style="margin-bottom:6px">Tire Health Map</div>
              <div class="tire-map-mini">${tireRows.join('')}</div>
            </div>
            <!-- Stats -->
            <div style="flex:1">
              <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:6px">Telematics</div>
              ${v.telematics ? `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:0.7rem">
                  <div><span class="text-muted">Speed:</span> ${v.telematics.avgSpeed||0}km/h</div>
                  <div><span class="text-muted">Fuel:</span> ${v.telematics.fuelEfficiency||0}km/L</div>
                  <div><span class="text-muted">Temp:</span> ${v.telematics.engineTempC||0}°C</div>
                  <div><span class="text-muted">Route:</span> ${v.currentRoute||'—'}</div>
                </div>
              ` : '<div style="font-size:0.75rem;color:var(--text-muted)">No telematics</div>'}
              <div style="margin-top:10px">
                <div style="display:flex;justify-content:space-between;font-size:0.7rem;margin-bottom:4px">
                  <span class="text-muted">Fleet health</span>
                  <span>${Math.round((tires.filter(t=>tireRisk(t)==='SAFE').length/Math.max(1,tires.length))*100)}%</span>
                </div>
                <div style="height:4px;background:var(--bg-surface);border-radius:2px">
                  <div style="height:100%;background:var(--grad-cyan);border-radius:2px;width:${Math.round((tires.filter(t=>tireRisk(t)==='SAFE').length/Math.max(1,tires.length))*100)}%;transition:width 1s ease"></div>
                </div>
              </div>
              <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();navigate('inspect')" style="margin-top:10px;width:100%;font-size:0.75rem">🔬 Inspect</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function setFilter(f, btn) {
  _activeFilter = f;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderVehicles();
}
function filterVehicles() { renderVehicles(); }
function navigate(p) { if(window.navigate)window.navigate(p); else window.location.hash=p; }
</script>
</main>
